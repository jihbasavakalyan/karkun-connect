<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1b4332" />
    <meta name="background-color" content="#1b4332" />
    <meta name="description" content="Campaign Execution Platform" />
    <meta name="application-name" content="Karkun Connect" />
    <meta name="apple-mobile-web-app-title" content="KC" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>Karkun Connect</title>
    <script>
      (function () {
        var host = String(location.hostname || '')
          .toLowerCase()
          .replace(/\.$/, '')
        if (host !== 'registration.jihbasavakalyan.org') return
        document.title = 'Tarbiyati Ijtema Registration'
        document.documentElement.setAttribute('data-public-registration', '1')
        if (location.pathname !== '/' && location.pathname !== '') {
          history.replaceState(null, '', '/' + location.search + location.hash)
        }
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (reg) {
              reg.unregister()
            })
          })
        }
        if (window.caches && caches.keys) {
          caches.keys().then(function (keys) {
            keys.forEach(function (key) {
              caches.delete(key)
            })
          })
        }
      })()
    </script>
    <style>
      /* KC-039 — fast branded first paint / splash atmosphere before React mounts */
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #1b4332;
      }
      #root:empty {
        position: relative;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(145deg, #0f3d24 0%, #14532d 42%, #1b4332 100%);
        color: #d8f3dc;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      #root:empty::before {
        content: 'Karkun Connect';
        font-weight: 700;
        font-size: 1.25rem;
        letter-spacing: 0.01em;
      }
      #root:empty::after {
        content: 'Campaign Execution Platform';
        position: absolute;
        margin-top: 3rem;
        font-size: 0.85rem;
        opacity: 0.85;
      }
      html[data-public-registration='1'] #root:empty::before {
        content: 'فعال کارکن، فعال رکن، فعال جماعت';
        font-size: 1.05rem;
      }
      html[data-public-registration='1'] #root:empty::after {
        content: 'Tarbiyati Ijtema Registration';
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
