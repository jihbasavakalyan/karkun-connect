<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1b4332" />
    <title>Karkun Connect — Offline</title>
    <style>
      :root {
        color-scheme: light;
        --primary: #1b4332;
        --muted: #d8f3dc;
        --text: #1a1a1a;
        --secondary: #4b5563;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: linear-gradient(145deg, #0f3d24 0%, #14532d 42%, #1b4332 100%);
        color: #fff;
        padding: 1.5rem;
      }
      .card {
        width: min(100%, 22rem);
        text-align: center;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 1rem;
        padding: 1.75rem 1.25rem;
      }
      .mark {
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1rem;
        border-radius: 1rem;
        background: var(--muted);
        display: grid;
        place-items: center;
        color: var(--primary);
        font-weight: 800;
        font-size: 1.25rem;
      }
      h1 {
        margin: 0 0 0.35rem;
        font-size: 1.25rem;
      }
      p {
        margin: 0 0 1.25rem;
        color: rgba(255, 255, 255, 0.85);
        line-height: 1.45;
        font-size: 0.95rem;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 0.75rem;
        min-height: 2.75rem;
        min-width: 8rem;
        padding: 0 1.25rem;
        font-weight: 700;
        font-size: 0.95rem;
        background: var(--muted);
        color: var(--primary);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark" aria-hidden="true">KC</div>
      <h1>You are offline.</h1>
      <p>Please reconnect to continue.</p>
      <button type="button" onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
